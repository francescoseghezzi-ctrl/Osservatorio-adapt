name: Nightly Observatory Checks (no paid AI)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
permissions:
  contents: read
concurrency:
  group: observatory-quality-checks
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify observatory structure and navigation
        run: npm test
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('app/index.html').read_text()
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          pathlib.Path('/tmp/observatory-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/observatory-inline.js
